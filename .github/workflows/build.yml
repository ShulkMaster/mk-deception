name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  build:
    # This is a private build container.
    # See https://github.com/encounter/dtk-template/blob/main/docs/github_actions.md
    container: ghcr.io/shulkmaster/mkd:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [GQNE5D]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
        fetch-depth: 0
        submodules: recursive

    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    - name: Prepare game files
      run: cp -a /orig .

    - name: Build PR branch baseline
      if: github.event_name == 'pull_request'
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        # Compare with the main commit the PR branch was based on. Using the
        # event's base SHA would move the baseline whenever main advances and
        # can report unrelated changes as regressions.
        base_sha="$(git merge-base HEAD "origin/${BASE_REF}")"
        echo "Comparing PR progress against ${base_sha} (${BASE_REF} merge base)"
        baseline_dir="${RUNNER_TEMP}/mkd-base-${{ matrix.version }}"
        git worktree add --detach "${baseline_dir}" "${base_sha}"
        cp -a /orig "${baseline_dir}/"
        cd "${baseline_dir}"
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source build/${{ matrix.version }}/report.json
        mkdir -p "${GITHUB_WORKSPACE}/build/${{ matrix.version }}"
        cp build/${{ matrix.version }}/report.json \
            "${GITHUB_WORKSPACE}/build/${{ matrix.version }}/baseline.json"

    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    - name: Upload maps
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    - name: Upload progress report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    - name: Compare PR against branch baseline
      if: github.event_name == 'pull_request'
      run: |
        build/tools/objdiff-cli report changes \
            --format json-pretty \
            build/${{ matrix.version }}/baseline.json \
            build/${{ matrix.version }}/report.json \
            --output build/${{ matrix.version }}/report_changes.json
        python3 tools/github_report.py \
            build/${{ matrix.version }}/report_changes.json \
            --output build/${{ matrix.version }}/github_report.md
        cat build/${{ matrix.version }}/github_report.md >> "${GITHUB_STEP_SUMMARY}"

    - name: Upload PR diff report
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_github_report
        path: build/${{ matrix.version }}/github_report.md

    - name: Publish objdiff report to PR
      # Tokens for pull requests from forks are read-only. Those builds still
      # publish the report as an artifact and in the workflow summary.
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/github-script@v9
      env:
        REPORT_PATH: build/${{ matrix.version }}/github_report.md
        REPORT_VERSION: ${{ matrix.version }}
      with:
        script: |
          const fs = require('fs');
          const marker = `<!-- objdiff-function-report:${process.env.REPORT_VERSION} -->`;
          const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
          const body = `${marker}\n${report}`;
          const issue_number = context.issue.number;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            { ...context.repo, issue_number, per_page: 100 },
          );
          const previous = comments.find(
            comment => comment.user?.type === 'Bot' && comment.body?.includes(marker),
          );
          if (previous) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: previous.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body,
            });
          }
