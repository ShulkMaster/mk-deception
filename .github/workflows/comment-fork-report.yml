name: Comment fork report

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [GQNE5D]

    steps:
    # Only the base repository's trusted script is checked out; the fork's
    # code never runs with this workflow's write token.
    - name: Checkout report script
      uses: actions/checkout@v4
      with:
        sparse-checkout: .github/scripts

    - name: Download objdiff report
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.version }}_github_report
        path: report
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Publish objdiff report to PR
      uses: actions/github-script@v9
      with:
        script: |
          // workflow_run.pull_requests is empty for pull requests from forks,
          // so find the open PR whose head is the built commit.
          const run = context.payload.workflow_run;
          const pulls = await github.paginate(github.rest.pulls.list, {
            ...context.repo,
            state: 'open',
            head: `${run.head_repository.owner.login}:${run.head_branch}`,
            per_page: 100,
          });
          const matches = pulls.filter(pull => pull.head.sha === run.head_sha);
          if (matches.length !== 1) {
            core.setFailed(`Expected one pull request for ${run.head_sha}, found ${matches.length}`);
            return;
          }

          const post = require('./.github/scripts/post_report.js');
          await post({
            github,
            context,
            issueNumber: matches[0].number,
            version: '${{ matrix.version }}',
            dir: 'report/github_comments',
          });
