name: Comment fork report

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: [GQNE5D]

    steps:
    - name: Download objdiff report
      uses: actions/download-artifact@v4
      with:
        name: ${{ matrix.version }}_github_report
        path: report
        github-token: ${{ github.token }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Publish objdiff report to PR
      uses: actions/github-script@v9
      env:
        REPORT_PATH: report/github_report.md
        REPORT_VERSION: ${{ matrix.version }}
      with:
        script: |
          const fs = require('fs');
          const pullRequests = context.payload.workflow_run.pull_requests;
          if (pullRequests.length !== 1) {
            core.setFailed(`Expected one pull request, found ${pullRequests.length}`);
            return;
          }

          const marker = `<!-- objdiff-function-report:${process.env.REPORT_VERSION} -->`;
          const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
          const body = `${marker}\n${report}`;
          const issue_number = pullRequests[0].number;
          const comments = await github.paginate(
            github.rest.issues.listComments,
            { ...context.repo, issue_number, per_page: 100 },
          );
          const previous = comments.find(
            comment => comment.user?.type === 'Bot' && comment.body?.includes(marker),
          );
          if (previous) {
            await github.rest.issues.updateComment({
              ...context.repo,
              comment_id: previous.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number,
              body,
            });
          }
